syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// 认证服务
service AuthenticationService {
  // 密码认证：identifier 即登录标识（username 或 email，服务端双路径查询）。
  // 目标应用由 gRPC metadata 的 application_code 决定（人机边界认 code）。
  // 自有控制台登录可不带该 metadata（缺省回退 iam 应用）；外部应用（如 sender）
  // 经内部 gRPC 调用时在出站 metadata 中携带自身 code，登录即锁定所属应用。
  rpc PasswordAuth(PasswordAuthRequest) returns (PasswordAuthResponse) {
    option (google.api.http) = {
      post: "/authentication/password-auth"
      body: "*"
    };
  }

  // 获取当前登录用户的个人信息（基本信息）
  // 仅凭登录态（JWT accountId）返回，不接收用户标识参数
  rpc GetMyProfile(google.protobuf.Empty) returns (GetMyProfileResponse) {
    option (google.api.http) = {
      get: "/authentication/my-profile"
    };
  }
}

message PasswordAuthRequest {
  // 登录标识：username 或 email（双标识登录，011 裁决）
  string identifier = 1 [(buf.validate.field).string.min_len = 1];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}

message PasswordAuthResponse {
  string access_token = 1;
}

message GetMyProfileResponse {
  // 用户基本信息（不含密码摘要、AK/SK 等敏感凭据字段）
  string id = 1;
  string username = 2;                       // 登录名（唯一）
  string nickname = 3;                       // 显示名（可空）
  string email = 4;                          // 邮箱（可空，唯一）
  string status = 5;                         // "enabled" 启用，"disabled" 禁用
  // 审计字段（只读回传，服务端注入）
  string created_by = 6;                      // 创建人（用户 id）
  google.protobuf.Timestamp create_time = 7;  // 创建时间
  // 是否 admin 角色（只读回传，服务端派生）：前端据此决定是否放开数据边界 UI
  bool is_admin = 9;
  // 用户可切换的数据归属应用清单（接入集合）：登录后应用选择页与左上角
  // 数据范围下拉的唯一数据源。admin 返回全部启用应用。
  repeated common.v1.ApplicationSummary applications = 10;
  reserved 8;
  reserved "home_application_id";
}
