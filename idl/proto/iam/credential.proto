syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// 访问凭证服务（specs/009-ak-sk-auth）：AK/SK 签名鉴权凭证，绑定账号创建；
// 凭证自身不携带权限，接口访问权限完全由绑定账号的 RBAC 授权决定（FR-015）。
service AccessCredentialService {
  // 创建凭证，响应中一次性返回明文 secret_key（之后任何接口不再返回，FR-002）
  rpc CreateAccessCredential(CreateAccessCredentialRequest) returns (CreateAccessCredentialResponse) {
    option (google.api.http) = {
      post: "/authentication/access-credentials"
      body: "*"
    };
  }

  // 凭证分页列表：支持按 account_id / access_key / status 筛选；全量业务字段（不含 secret_key）
  rpc ListAccessCredentials(ListAccessCredentialsRequest) returns (ListAccessCredentialsResponse) {
    option (google.api.http) = {
      get: "/authentication/access-credentials"
    };
  }

  // 凭证详情：全量业务字段（不含 secret_key）
  rpc GetAccessCredential(common.v1.GetRequest) returns (AccessCredential) {
    option (google.api.http) = {
      get: "/authentication/access-credentials/{id}"
    };
  }

  // 修改凭证可编辑字段全集：remark、expire_time（审计字段不可入参，宪法 XII）
  rpc UpdateAccessCredential(UpdateAccessCredentialRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/authentication/access-credentials/{id}"
      body: "*"
    };
  }

  // 启用/禁用凭证（非 CRUD 动作，POST + 动作语义，宪法 XIV）；幂等
  rpc ChangeAccessCredentialStatus(ChangeAccessCredentialStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/authentication/access-credentials/{id}/status"
      body: "*"
    };
  }

  // 重置 SK：AK 不变，生成新 SK 一次性返回，旧 SK 立即失效（FR-008）
  rpc ResetAccessCredentialSecret(ResetAccessCredentialSecretRequest) returns (ResetAccessCredentialSecretResponse) {
    option (google.api.http) = {
      post: "/authentication/access-credentials/{id}/reset-secret"
      body: "*"
    };
  }

  // 删除凭证：物理删除（基础架构型模型，宪法 XIV），服务端完成引用校验并记录审计日志
  rpc DeleteAccessCredential(DeleteAccessCredentialRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/authentication/access-credentials/{id}"
    };
  }
}

// 访问凭证（不含 secret_key——明文仅出现在创建/重置响应中）
message AccessCredential {
  string id = 1;                                   // 雪花 ID（string 编码）
  string access_key = 2;                           // AK，FAK 前缀，全局唯一，创建后不可变
  string account_id = 3;                           // 绑定账号 id（string 编码）
  string account_name = 4;                         // 绑定账号名（服务端组装，只读）
  string remark = 5;                               // 备注用途
  // 状态："enabled" 启用，"disabled" 禁用（与账号状态取值一致）
  string status = 6;
  google.protobuf.Timestamp expire_time = 7;       // 可空：永不过期
  google.protobuf.Timestamp last_used_time = 8;    // 可空：从未使用（节流更新，分钟级精度）
  int64 version = 9;                               // 乐观锁版本号
  // 审计字段（只读回传，由服务端注入；请求消息不含此类字段，宪法 XII）
  string created_by = 10;
  string updated_by = 11;
  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp update_time = 13;
}

message CreateAccessCredentialRequest {
  // 绑定账号 id；账号必须存在且启用（FR-004）
  int64 account_id = 1 [(buf.validate.field).required = true];
  string remark = 2 [(buf.validate.field).string.max_len = 255];
  // 过期时间；可空 = 永不过期
  google.protobuf.Timestamp expire_time = 3;
}

message CreateAccessCredentialResponse {
  AccessCredential credential = 1;
  string secret_key = 2; // 一次性明文 SK，仅此响应返回
}

message ListAccessCredentialsRequest {
  int64 current_page = 1;
  int64 page_size = 2;
  // 筛选条件，均可空 = 不筛
  int64 account_id = 3;
  string access_key = 4;
  string status = 5 [(buf.validate.field).string = { in: ["", "enabled", "disabled"] }];
}

message ListAccessCredentialsResponse {
  common.v1.Page page = 1;
  repeated AccessCredential access_credentials = 2;
}

message UpdateAccessCredentialRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  string remark = 2 [(buf.validate.field).string.max_len = 255];
  google.protobuf.Timestamp expire_time = 3;
  int64 version = 4 [(buf.validate.field).required = true];
}

message ChangeAccessCredentialStatusRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  // 目标状态："enabled" 启用，"disabled" 禁用
  string status = 2 [(buf.validate.field).string = { in: ["enabled", "disabled"] }];
}

message ResetAccessCredentialSecretRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}

message ResetAccessCredentialSecretResponse {
  AccessCredential credential = 1;
  string secret_key = 2; // 一次性明文新 SK
}

message DeleteAccessCredentialRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}
