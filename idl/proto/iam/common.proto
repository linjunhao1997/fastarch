syntax = "proto3";

package iam.v1;

option go_package = "iam.v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

message StatusResponse {
  Status status = 1;
}

message Status {
  string code = 1;
  string data_id = 2;
  string message = 3;
}


message Page {
  int64 total = 1;         // 总记录数
  int64 current_page = 2;  // 当前页码
  int64 page_size = 3;     // 每页记录数
  int64 total_pages = 4;   // 总页数
}

message GetRequest {
  int64 id = 1;
}