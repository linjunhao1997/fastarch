syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// 用户管理服务（服务名保持 AccountService，HTTP 路径 /account/accounts 稳定不变；
// 消息语义为 t_user 用户：username 唯一登录名 + email 双标识）
service AccountService {
  // 创建用户：初始密码必填（bcrypt 落库），返回创建出的用户（含 id）
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/account/accounts"
      body: "*"
    };
  }

  // 获取用户信息
  rpc GetAccount(common.v1.GetRequest) returns (Account) {
    option (google.api.http) = {
      get: "/account/accounts/{id}"
    };
  }

  // 获取用户列表：keyword 模糊匹配 username/nickname/email
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {
      get: "/account/accounts"
    };
  }

  // 修改用户：nickname/email/status 可选更新（字段缺省 = 不修改）
  rpc UpdateAccount(UpdateAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/account/accounts/{id}"
      body: "*"
    };
  }

  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/account/accounts/{id}"
    };
  }

  rpc UpdateAccountRoles(UpdateAccountRolesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/account/accounts/{account_id}/roles"
      body: "*"
    };
  }

  // 分配用户可进入的应用（多应用裁决 #8）：全量覆盖语义，空数组 = 清空准入
  rpc UpdateAccountApplications(UpdateAccountApplicationsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/account/accounts/{account_id}/applications"
      body: "*"
    };
  }

  // 管理员重置用户密码：新密码 bcrypt 落库，不要求提供旧密码
  rpc ResetAccountPassword(ResetAccountPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/account/accounts/{id}/reset-password"
      body: "*"
    };
  }
}

message CreateAccountRequest {
  string username = 1 [(buf.validate.field).string.min_len = 1];
  string nickname = 2;
  // 邮箱可选；空串经 ignore=IGNORE_IF_ZERO_VALUE 显式跳过，非空时必须合法
  string email = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.email = true];
  // 初始密码必填（bcrypt 摘要落库，明文不落盘）
  string password = 4 [(buf.validate.field).string.min_len = 8];
  // 初始角色 id 集合（string 编码），可选；缺省不绑定角色
  repeated string role_ids = 5;
}

message ListAccountsRequest {
  int64 current_page = 1;
  int64 page_size = 2;
  // 模糊匹配 username/nickname/email
  string keyword = 3;
}

message ListAccountsResponse {
  common.v1.Page page = 1;
  repeated Account accounts = 2;
}

message UpdateAccountRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  // 以下字段缺省（空串）= 不修改（与现有更新风格一致）
  string nickname = 2;
  string email = 3;
  // 用户状态："enabled" 启用，"disabled" 禁用；缺省不修改
  string status = 4 [(buf.validate.field).string = { in: ["", "enabled", "disabled"] }];
  // 乐观锁版本号
  int64 version = 5 [(buf.validate.field).required = true];
}

message UpdateAccountRolesRequest {
  int64 account_id = 1 [(buf.validate.field).required = true];
  repeated string added_role_code_list = 2;
  repeated string removed_role_code_list = 3;
}

message UpdateAccountApplicationsRequest {
  int64 account_id = 1 [(buf.validate.field).required = true];
  // 目标应用 id 集合（string 编码）：全量覆盖语义，空数组 = 清空准入
  repeated string application_ids = 2;
}

message ResetAccountPasswordRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  // 新密码（管理员重置，无需旧密码）
  string new_password = 2 [(buf.validate.field).string.min_len = 8];
}

message DeleteAccountRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}


// 用户信息（t_user 语义；不含密码摘要等敏感字段，宪法 XII）
message Account {
  string id = 1;
  string username = 2;                        // 唯一登录名
  string email = 3;                           // 邮箱（可空，唯一）
  string nickname = 4;                        // 显示名（可空）
  // 用户状态（只读回传）："enabled" 启用，"disabled" 禁用
  string status = 5;
  int64 version = 6;
  // 绑定的角色编码清单（只读回传）
  repeated string role_code_list = 7;
  // 审计字段（只读回传，由服务端注入；请求消息不含此类字段，宪法 XII）
  string created_by = 8;                      // 创建人（用户 id）
  string updated_by = 9;                      // 修改人（用户 id）
  google.protobuf.Timestamp create_time = 10; // 创建时间
  google.protobuf.Timestamp update_time = 11; // 修改时间
  // 可进入的应用 id 集合（只读回传，string 编码；仅 GetAccount 填充，列表不回填）
  repeated string application_id_list = 12;
}
