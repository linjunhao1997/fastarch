syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "google/api/annotations.proto";
import "buf/validate/validate.proto";

// 联邦内部契约（机器间调用）：供宿主服务（sender 等）查询 IAM 的角色数据，
// 用于菜单可见性过滤与角色绑定校验（角色域归 IAM，ADR 0001/0003）。
// 鉴权：应用凭证经 metadata x-fa-app-id / x-fa-app-secret 携带，服务内自鉴权
// （sha256 hex 校 t_application.secret_hash，应用须 enabled，fail-closed）；
// 鉴权拦截器白名单放行本服务（不走 JWT）。
service FederationService {
  // 查询账号绑定的角色 id 集合（宿主侧边栏按角色过滤菜单用）
  rpc GetAccountRoleIds(GetAccountRoleIdsRequest) returns (GetAccountRoleIdsResponse) {
    option (google.api.http) = {
      get: "/iam/federation/accounts/{user_id}/role-ids"
    };
  }

  // 校验角色存在（宿主菜单绑定前校验用）
  rpc RoleExists(RoleExistsRequest) returns (RoleExistsResponse) {
    option (google.api.http) = {
      get: "/iam/federation/roles/{role_id}/exists"
    };
  }
}

message GetAccountRoleIdsRequest {
  int64 user_id = 1 [(buf.validate.field).required = true];
}

message GetAccountRoleIdsResponse {
  // 角色 id 集合（string 编码）
  repeated string role_ids = 1;
}

message RoleExistsRequest {
  int64 role_id = 1 [(buf.validate.field).required = true];
}

message RoleExistsResponse {
  bool exists = 1;
}
