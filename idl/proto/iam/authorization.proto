syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";


// 授权管理服务
service AuthorizationService {
  // 创建权限，返回创建出的权限（含 id）
  rpc CreatePermission(CreatePermissionRequest) returns (Permission) {
    option (google.api.http) = {
      post: "/authorization/permissions"
      body: "*"
    };
  }

  // 获取权限信息
  rpc GetPermission(common.v1.GetRequest) returns (Permission) {
    option (google.api.http) = {
      get: "/authorization/permissions/{id}"
    };
  }

  // 获取权限列表
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {
      get: "/authorization/permissions"
    };
  }

  // 修改权限信息
  rpc UpdatePermission(UpdatePermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/authorization/permissions/{id}"
      body: "*"
    };
  }

  rpc DeletePermission(DeletePermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/authorization/permissions/{id}"
    };
  }

  // 创建角色，返回创建出的角色（含 id）
  rpc CreateRole(CreateRoleRequest) returns (Role) {
    option (google.api.http) = {
      post: "/authorization/roles"
      body: "*"
    };
  }

  // 获取角色信息
  rpc GetRole(common.v1.GetRequest) returns (Role) {
    option (google.api.http) = {
      get: "/authorization/roles/{id}"
    };
  }

  // 获取角色列表
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/authorization/roles"
    };
  }

  // 修改角色信息
  rpc UpdateRole(UpdateRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/authorization/roles/{id}"
      body: "*"
    };
  }

  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/authorization/roles/{id}"
    };
  }

  // 申请权限，返回创建出的申请记录（含 id）
  rpc CreateSubscription(CreateSubscriptionRequest) returns (Subscription) {
    option (google.api.http) = {
      post: "/authorization/subscriptions"
      body: "*"
    };
  }

  // 申请记录详情
  rpc GetSubscription(common.v1.GetRequest) returns (Subscription) {
    option (google.api.http) = {
      get: "/authorization/subscriptions/{id}"
    };
  }

  // 修改申请记录
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/authorization/subscriptions/{id}"
      body: "*"
    };
  }

  // 申请记录列表
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
    option (google.api.http) = {
      get: "/authorization/subscriptions"
    };
  }

  // 鉴权：校验当前账号是否拥有指定权限
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse) {
    option (google.api.http) = {
      post: "/authorization/check-permission"
      body: "*"
    };
  }
}

message CreatePermissionRequest {
  int64 application_id = 1 [(buf.validate.field).required = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string code = 3 [(buf.validate.field).string.min_len = 1];
  string value = 4;
  string description = 5;
}

message CreateRoleRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string role_code = 2 [(buf.validate.field).string.min_len = 1];
}

message ListPermissionsRequest {
  int64 current_page = 1;
  int64 page_size = 2;
}

message ListRolesRequest {
  int64 current_page = 1;
  int64 page_size = 2;
}

message ListPermissionsResponse {
  common.v1.Page page = 1;
  repeated Permission permissions = 2;
}

message ListRolesResponse {
  common.v1.Page page = 1;
  repeated Role roles = 2;
}

message UpdatePermissionRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  string name = 2;
  string enabled_status = 3;
  int64 version = 4 [(buf.validate.field).required = true];
}

message UpdateRoleRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  string name = 2;
  string enabled_status = 3;
  // 本次新增/移除的权限编码
  repeated string added_permission_code_list = 4;
  repeated string removed_permission_code_list = 5;
  int64 version = 6 [(buf.validate.field).required = true];
}

message DeletePermissionRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}

message DeleteRoleRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}

message CreateSubscriptionRequest {
  repeated string role_code_list = 1;
  repeated string permission_code_list = 2;
}

message UpdateSubscriptionRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  repeated string role_code_list = 2;
  repeated string permission_code_list = 3;
}

message ListSubscriptionsRequest {
  int64 current_page = 1;
  int64 page_size = 2;
}

message ListSubscriptionsResponse {
  common.v1.Page page = 1;
  repeated Subscription subscriptions = 2;
}

// 权限信息
message Permission {
  string id = 1;
  string name = 2;
  int64 application_id = 3;
  string permission_code = 4;
  string enabled_status = 5;
  int64 version = 6;
}

// 角色信息
message Role {
  string id = 1;
  string name = 2;
  int64 application_id = 3;
  string role_code = 4;
  string enabled_status = 5;
  repeated string permission_code_list = 6;
  int64 version = 7;
}

// 权限申请记录
message Subscription {
  string id = 1;
  string source_application_code = 2;
  string target_application_code = 3;
  repeated string role_code_list = 4;
  repeated string permission_code_list = 5;
  int64 applicant_id = 6;
  int64 approver_id = 7;
  string applicant_name = 8;
  string approver_name = 9;
  string status = 10;
}

// 检查权限
message CheckPermissionRequest {
  string application_code = 1 [(buf.validate.field).string.min_len = 1];
  string permission_code = 2 [(buf.validate.field).string.min_len = 1];
}

message CheckPermissionResponse {
  bool ok = 1;
}
