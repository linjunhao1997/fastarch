syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "common/menu/menu.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// 菜单管理服务（iam 宿主，t_menu + t_r_role_menu）。
// 消息共享 common.menu.v1（contrib 统一实现，各宿主 service 自持）；
// HTTP 路径以 /iam 服务前缀挂载，多宿主按路径前缀路由（ADR 0001 修订）。
service MenuService {
  // 创建菜单，返回创建出的菜单（含 id）
  rpc CreateMenu(common.menu.v1.CreateMenuRequest) returns (common.menu.v1.Menu) {
    option (google.api.http) = {
      post: "/iam/menu/menus"
      body: "*"
    };
  }

  // 获取菜单信息
  rpc GetMenu(common.v1.GetRequest) returns (common.menu.v1.Menu) {
    option (google.api.http) = {
      get: "/iam/menu/menus/{id}"
    };
  }

  // 修改菜单信息
  rpc UpdateMenu(common.menu.v1.UpdateMenuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/iam/menu/menus/{id}"
      body: "*"
    };
  }

  // 删除菜单（仅当未被角色绑定引用时可删除）
  rpc DeleteMenu(common.menu.v1.DeleteMenuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/iam/menu/menus/{id}"
    };
  }

  // 管理员视角全量菜单树（含停用菜单，前端置灰）
  rpc ListMenuTree(google.protobuf.Empty) returns (common.menu.v1.ListMenuTreeResponse) {
    option (google.api.http) = {
      get: "/iam/menu/menu-tree"
    };
  }

  // 当前登录用户可见菜单树：按用户角色绑定（t_r_role_menu）过滤并回补祖先路径，
  // 仅需登录态（self-scoped，无需菜单权限）
  rpc ListMyMenuTree(google.protobuf.Empty) returns (common.menu.v1.ListMenuTreeResponse) {
    option (google.api.http) = {
      get: "/iam/menu/my-menu-tree"
    };
  }

  // 角色绑定菜单全量覆盖：以 menu_ids 为目标绑定集合做整体替换（事务）。
  // 绑定仅决定可见性，不授予权限（ADR 0002）。
  rpc UpdateRoleMenus(common.menu.v1.UpdateRoleMenusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/iam/menu/roles/{role_id}/menus"
      body: "*"
    };
  }

  // 查询角色绑定的菜单 id 集合（编辑角色页回显用）
  rpc ListRoleMenus(common.menu.v1.ListRoleMenusRequest) returns (common.menu.v1.ListRoleMenusResponse) {
    option (google.api.http) = {
      get: "/iam/menu/roles/{role_id}/menus"
    };
  }
}
