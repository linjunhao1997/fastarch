syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";


// 应用管理服务
service ApplicationService {
  // 创建应用，返回创建出的应用（含 id）
  rpc CreateApplication(CreateApplicationRequest) returns (Application) {
    option (google.api.http) = {
      post: "/application/applications"
      body: "*"
    };
  }

  // 获取应用信息
  rpc GetApplication(common.v1.GetRequest) returns (Application) {
    option (google.api.http) = {
      get: "/application/applications/{id}"
    };
  }

  // 获取应用列表
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {
    option (google.api.http) = {
      get: "/application/applications"
    };
  }

  // 修改应用信息
  rpc UpdateApplication(UpdateApplicationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/application/applications/{id}"
      body: "*"
    };
  }
}

message CreateApplicationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
}

message ListApplicationsRequest {
  int64 current_page = 1;
  int64 page_size = 2;
}

message ListApplicationsResponse {
  common.v1.Page page = 1;
  repeated Application applications = 2;
}

message UpdateApplicationRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  string name = 2;
  string description = 3;
  string enabled_status = 4;
}


// 应用信息
message Application {
  string id = 1;
  string name = 2;
  string app_code = 3;
  string description = 4;
  string enabled_status = 5;
}