syntax = "proto3";

package iam.v1;

option go_package = "iam.v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "iam/common.proto";
import "google/api/annotations.proto";


// 应用管理服务
service ApplicationService {
  // 创建应用
  rpc CreateApplication(CreateApplicationRequest) returns (StatusResponse) {
    option (google.api.http) = {
      post: "/application/applications"
      body: "*"
    };
  }

  // 获取应用信息
  rpc GetApplication(GetRequest) returns (GetApplicationResponse) {
    option (google.api.http) = {
      get: "/application/applications/{id}"
    };
  }

  // 获取应用列表
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {
    option (google.api.http) = {
      get: "/application/applications"
    };
  }

  // 修改应用信息
  rpc UpdateApplication(UpdateApplicationRequest) returns(StatusResponse) {
    option (google.api.http) = {
      patch: "/application/applications/{id}"
      body: "*"
    };
  }
}

message CreateApplicationRequest {
  string name = 1;
  string email = 2;
}

message ListApplicationsRequest {
  int64 current_page = 1;
  int64 page_size = 2;
}

message GetApplicationResponse {
  Status status = 1;
  Application application = 2;
}

message ListApplicationsResponse {
  Status status = 1;
  Page page = 2;
  repeated Application applications = 3;
}

message UpdateApplicationRequest {
  int64 id = 1;
  string name = 2;
  string enabled_status = 3;
}


// 应用详细信息
message Application {
  string id = 1;
  string name = 2;
  string app_code = 3;
  string description = 4;
  string enabled_status = 5;
}
