syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";


// 应用管理服务（t_application：app_id 唯一标识 + secret 仅存 sha256 摘要）
service ApplicationService {
  // 创建应用：服务端生成 app_id 与随机 secret，响应一次性返回 secret 明文
  // （服务端只存 sha256 摘要，之后任何接口不再返回）
  rpc CreateApplication(CreateApplicationRequest) returns (CreateApplicationResponse) {
    option (google.api.http) = {
      post: "/application/applications"
      body: "*"
    };
  }

  // 获取应用信息（不回传 secret）
  rpc GetApplication(common.v1.GetRequest) returns (Application) {
    option (google.api.http) = {
      get: "/application/applications/{id}"
    };
  }

  // 获取应用列表（不回传 secret）
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {
    option (google.api.http) = {
      get: "/application/applications"
    };
  }

  // 修改应用信息（name/status）
  rpc UpdateApplication(UpdateApplicationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/application/applications/{id}"
      body: "*"
    };
  }

  // 删除应用（仅当未被授权数据引用时可删除）
  rpc DeleteApplication(DeleteApplicationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/application/applications/{id}"
    };
  }
}

message CreateApplicationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 应用状态："enabled" 启用，"disabled" 禁用；缺省为 enabled
  string status = 2 [(buf.validate.field).string = { in: ["", "enabled", "disabled"] }];
  // 服务段编码（多应用裁决 #8）：权限码命名空间（iam.order.delete 的 iam 段），
  // 全局唯一，创建后不可变更；小写字母开头，仅小写字母/数字/下划线
  string code = 3 [(buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^[a-z][a-z0-9_]*$"}];
}

message CreateApplicationResponse {
  Application application = 1;
  // 一次性返回的 secret 明文（服务端仅存 sha256 hex 摘要），仅此响应可见
  string secret = 2;
}

message ListApplicationsRequest {
  int64 current_page = 1;
  int64 page_size = 2;
  string keyword = 3;
}

message ListApplicationsResponse {
  common.v1.Page page = 1;
  repeated Application applications = 2;
}

message UpdateApplicationRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  // 以下字段缺省（空串）= 不修改
  string name = 2;
  string status = 3 [(buf.validate.field).string = { in: ["", "enabled", "disabled"] }];
}

message DeleteApplicationRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}


// 应用信息（t_application 全列；不含 secret 摘要等敏感字段，宪法 XII）
message Application {
  string id = 1;
  string app_id = 2;                           // 应用标识（服务端生成，唯一）
  string name = 3;
  // 应用状态："enabled" 启用，"disabled" 禁用
  string status = 4;
  int64 version = 5;
  // 审计字段（只读回传，由服务端注入；请求消息不含此类字段，宪法 XII）
  string created_by = 6;                       // 创建人（用户 id）
  string updated_by = 7;                       // 修改人（用户 id）
  google.protobuf.Timestamp create_time = 8;   // 创建时间
  google.protobuf.Timestamp update_time = 9;   // 修改时间
  string code = 10;                            // 服务段编码（权限码命名空间，只读回传）
}
