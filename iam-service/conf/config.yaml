database:
  dsn: "root:mysql12345678@tcp(127.0.0.1:3306)/iam_dev?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "localhost:6379"

grpc:
  addr: "127.0.0.1"
  port: 9090

http:
  addr: "127.0.0.1"
  port: 8080
  endpoint: "127.0.0.1:9090"

jwt:
  secret: "your-secret-key"
  expiration_hours: 24

app:
  name: "iam-service"
  mode: "debug"

# 访问凭证（AK/SK 签名鉴权，specs/009-ak-sk-auth）
# encrypt_key 生产环境必须经环境变量 IAM_CREDENTIAL_ENCRYPT_KEY 注入（32 字节 hex/base64），
# 禁止写入本文件入库入仓；本地调试可临时在此配置。
credential:
  timestamp_window_seconds: 300
  max_credentials_per_account: 20
  # 本地开发密钥经环境变量 IAM_CREDENTIAL_ENCRYPT_KEY 注入；轮换后已落库的旧密文将无法解密
  encrypt_key: ""