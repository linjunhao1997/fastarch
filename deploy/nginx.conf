# fastarch 前端（app 产物）独立部署配置。
# 所有服务前端共用一个站点：SPA 路由回退 index.html，
# 各服务 API 前缀反代到对应 grpc-gateway，后续新增服务按前缀追加 location。
#
# 使用：
#   cd app && pnpm build          # 产物在 app/dist
#   将 app/dist 拷贝到 /var/www/fastarch（或改 root 指向）
#   nginx -c /path/to/nginx.conf  # 或 include 到主配置
server {
    listen 80;
    server_name _;

    root /var/www/fastarch;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # proxy_set_header 在 server 级定义，被下方各 location 继承
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API 前缀反代（尾部斜杠避免误匹配前端路由前缀，如 /authorization_management/...）
    location /account/         { proxy_pass http://127.0.0.1:8080; }
    location /application/     { proxy_pass http://127.0.0.1:8080; }
    location /authentication/  { proxy_pass http://127.0.0.1:8080; }
    location /authorization/   { proxy_pass http://127.0.0.1:8080; }

    # 带内容哈希的静态资源：永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback：页面刷新交给前端路由（与 vite dev 代理的修复同一原则）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后刷新拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
