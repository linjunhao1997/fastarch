// 契约增量（Phase 1 设计产物）：认证策略管理完整契约。
// 实施时落位于 idl/proto/iam/auth_policy.proto，随后在 idl/proto/ 下运行 ./protoc.sh 生成代码。
// 风格与 idl/proto/iam/application.proto 等既有契约保持一致。

syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";

// 认证策略管理服务
// 策略类型固定三种：sso（单点登录认证）/ mfa（多重身份认证）/ otp（一次性密码认证）；
// 策略类型创建后不可变；同类型下名称唯一。
service AuthenticationPolicyService {
  // 创建认证策略，返回创建出的策略（含 id）
  rpc CreateAuthenticationPolicy(CreateAuthenticationPolicyRequest) returns (AuthenticationPolicy) {
    option (google.api.http) = {
      post: "/authentication/policies"
      body: "*"
    };
  }

  // 获取认证策略信息
  rpc GetAuthenticationPolicy(common.v1.GetRequest) returns (AuthenticationPolicy) {
    option (google.api.http) = {
      get: "/authentication/policies/{id}"
    };
  }

  // 按策略类型查询列表（policy_type 必填）
  rpc ListAuthenticationPolicies(ListAuthenticationPoliciesRequest) returns (ListAuthenticationPoliciesResponse) {
    option (google.api.http) = {
      get: "/authentication/policies"
    };
  }

  // 修改认证策略（名称/描述/实现方式标识；需携带读取时的 version 做乐观锁判定）
  rpc UpdateAuthenticationPolicy(UpdateAuthenticationPolicyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/authentication/policies/{id}"
      body: "*"
    };
  }

  // 删除认证策略（物理删除）
  rpc DeleteAuthenticationPolicy(DeleteAuthenticationPolicyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/authentication/policies/{id}"
    };
  }
}

// 认证策略
message AuthenticationPolicy {
  int64 id = 1;               // 唯一标识
  string policy_type = 2;     // sso | mfa | otp（创建后不可变）
  string name = 3;            // 策略名称（同类型下唯一）
  string description = 4;     // 策略描述
  string implementation_id = 5; // 实现方式标识
  int64 version = 6;          // 乐观锁版本号（更新时回传）
}

message CreateAuthenticationPolicyRequest {
  string policy_type = 1 [(buf.validate.field).string = { in: ["sso", "mfa", "otp"] }];
  string name = 2 [(buf.validate.field).string = { min_len: 1, max_len: 64 }];
  string description = 3 [(buf.validate.field).string = { min_len: 1, max_len: 255 }];
  string implementation_id = 4 [(buf.validate.field).string = { min_len: 1, max_len: 64 }];
}

message ListAuthenticationPoliciesRequest {
  string policy_type = 1 [(buf.validate.field).string = { in: ["sso", "mfa", "otp"] }];
  int64 current_page = 2;
  int64 page_size = 3;
}

message ListAuthenticationPoliciesResponse {
  common.v1.Page page = 1;
  repeated AuthenticationPolicy authentication_policies = 2;
}

message UpdateAuthenticationPolicyRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  string name = 2 [(buf.validate.field).string = { min_len: 1, max_len: 64 }];
  string description = 3 [(buf.validate.field).string = { min_len: 1, max_len: 255 }];
  string implementation_id = 4 [(buf.validate.field).string = { min_len: 1, max_len: 64 }];
  int64 version = 5 [(buf.validate.field).required = true]; // 读取时的版本号，不匹配则冲突拒绝
}

message DeleteAuthenticationPolicyRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}
