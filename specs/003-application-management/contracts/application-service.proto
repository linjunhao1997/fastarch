# Contract: ApplicationService 契约增量（003）

Phase 1 产出。本文件是 `idl/proto/iam/application.proto` 的**增量契约**（规划产物，非直接落盘的源文件；实现阶段将此增量合入 proto 源文件后运行 `idl/proto/protoc.sh` 重新生成）。

日期：2026-09-05

---

## 新增 RPC

```proto
// 删除应用（仅当未被授权数据引用时可删除）
rpc DeleteApplication(DeleteApplicationRequest) returns (google.protobuf.Empty) {
  option (google.api.http) = {
    delete: "/application/applications/{id}"
  };
}

message DeleteApplicationRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}
```

既有 RPC（Create/Get/List/Update）契约不变。

## REST 契约

| 方法 | 路径 | 鉴权 | 成功响应 | 失败语义 |
| --- | --- | --- | --- | --- |
| DELETE | `/application/applications/{id}` | 需登录 + 管理权限（Auth 拦截器按方法名校验） | 200，空体（`google.protobuf.Empty`） | 见下 |

### 错误语义（grpc-gateway 错误体，message 需用户可理解）

| 场景 | HTTP 状态 | 触发条件 |
| --- | --- | --- |
| 参数校验失败（id 缺失/非法） | 400 | buf.validate 生成层校验 |
| 应用不存在（含并发下已被删除） | 404 | `RowsAffected == 0`，经 GORM 错误映射链路 |
| 应用被授权数据引用 | 409（以网关映射为准） | service 层引用检查命中，message：应用已被引用，请先解除引用 |
| 未登录 / 无权限 | 401 / 403 | Auth 拦截器既有行为 |

> 注：引用冲突的具体 HTTP 状态码以 service 层错误构造方式经网关映射后的实际结果为准；实现时保持与既有业务错误映射一致，前端按 message 展示。

## 前端 API 契约

`app/src/api/iam.ts` — `applicationApi` 新增：

```ts
delete: (id: string): Promise<void> =>
  request<void>(`/application/applications/${id}`, { method: "DELETE" }),
```

既有 `create / get / list / update` 契约不变；`request` helper 已支持 DELETE，无需改动（见 research.md D5）。

## 前端交互契约

`ApplicationListPage.tsx` 操作列新增"删除"按钮：

1. 点击 → `Modal.confirm`：标题"确认删除"，内容"确定要删除此应用吗？删除后不可恢复。"
2. 确认 → 调用 `applicationApi.delete(id)` → 成功：`message.success("删除成功")` 并刷新列表
3. 失败 → `useApiErrorNotification` 展示后端返回的用户可理解消息，列表保持不变
