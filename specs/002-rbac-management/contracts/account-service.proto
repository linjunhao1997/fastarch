// 契约增量（Phase 1 设计产物）：账号域——删除能力 + 账号-角色绑定管理 + 并发防护。
// 实施时合入 idl/proto/iam/account.proto，随后在 idl/proto/ 下运行 ./protoc.sh 生成代码。
// 【新增】标记的部分为本特性增量；其余为既有契约（原样保留，便于阅读上下文）。

syntax = "proto3";

package iam.v1;

option go_package = "github.com/linjunhao1997/idl/pb/iam;iam_v1";
option java_multiple_files = true;
option java_package = "com.iam.v1";

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";

// 账号管理服务
service AccountService {
  // 创建账号，返回创建出的账号（含 id）
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/account/accounts"
      body: "*"
    };
  }

  // 获取账号信息（【增量】响应回填 role_code_list）
  rpc GetAccount(common.v1.GetRequest) returns (Account) {
    option (google.api.http) = {
      get: "/account/accounts/{id}"
    };
  }

  // 获取账号列表（【增量】响应回填 role_code_list；实现需 ORDER BY id ASC 保证翻页稳定）
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {
      get: "/account/accounts"
    };
  }

  // 修改账号（【增量】version 必填，乐观锁并发检测）
  rpc UpdateAccount(UpdateAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/account/accounts/{id}"
      body: "*"
    };
  }

  // 【新增】删除账号（仅当未绑定任何角色时可删除；物理删除）
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/account/accounts/{id}"
    };
  }

  // 【新增】账号-角色绑定管理：批量绑定/解绑（单事务、幂等、校验角色存在；变更即时生效——提交后失效受影响账号的权限快照）
  rpc UpdateAccountRoles(UpdateAccountRolesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/account/accounts/{account_id}/roles"
      body: "*"
    };
  }
}

message CreateAccountRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string email = 2 [(buf.validate.field).string.email = true];
  // 账号类型："0" 用户，"1" 系统
  string kind = 3 [(buf.validate.field).string = { in: ["0", "1"] }];
}

message ListAccountsRequest {
  int64 current_page = 1;
  int64 page_size = 2;
  string id = 3;
}

message ListAccountsResponse {
  common.v1.Page page = 1;
  repeated Account accounts = 2;
}

message UpdateAccountRequest {
  int64 id = 1 [(buf.validate.field).required = true];
  string status = 2;
  string password = 3;
  string name = 4;
  string email = 5;
  // 【新增】乐观锁版本号（编辑页读取数据时获得，不匹配则冲突拒绝）
  int64 version = 6 [(buf.validate.field).required = true];
}

// 【新增】绑定/解绑角色（增量语义：只提交变化的编码）
message UpdateAccountRolesRequest {
  int64 account_id = 1 [(buf.validate.field).required = true];
  // 本次绑定的角色编码（须真实存在；已绑定的编码视为幂等成功）
  repeated string added_role_code_list = 2;
  // 本次解绑的角色编码（未绑定的编码视为幂等成功）
  repeated string removed_role_code_list = 3;
}

// 【新增】删除账号请求
message DeleteAccountRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}

// 账号信息
message Account {
  string id = 1;
  string name = 2;
  string email = 3;
  // 账号类型："0" 用户，"1" 系统
  string kind = 4;
  // 【新增】当前绑定的角色编码列表（Get/List 回填；绑定关系可查询，FR-12）
  repeated string role_code_list = 5;
}
